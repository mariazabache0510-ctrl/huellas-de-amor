<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Adopciones')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<section class="section">
    <div class="container">
        <h1 class="section-title">Gestión de adopciones</h1>
        <p class="section-lead">Revisa, aprueba o rechaza solicitudes. Esta vista también vive dentro del panel de administración.</p>
        <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="panel table-wrap" th:if="${!#lists.isEmpty(adopciones)}">
            <table>
                <thead>
                <tr>
                    <th>Mascota</th><th>Adoptante</th><th>Voluntario</th><th>Fecha</th><th>Estado</th><th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${adopciones}">
                    <td th:text="${a.mascotaNombre}"></td>
                    <td th:text="${a.adoptanteNombre}"></td>
                    <td th:text="${a.voluntarioNombre != null ? a.voluntarioNombre : '—'}"></td>
                    <td th:text="${a.fechaSolicitud}"></td>
                    <td><span class="badge" th:text="${a.estado}"></span></td>
                    <td class="actions" th:if="${a.estado.name() == 'PENDIENTE'}">
                        <form th:action="@{/adopciones/gestionar/{id}/aprobar(id=${a.id})}" method="post">
                            <input type="hidden" name="observaciones" value="Aprobada tras revisión">
                            <button class="btn btn-primary" type="submit">Aprobar</button>
                        </form>
                        <form th:action="@{/adopciones/gestionar/{id}/rechazar(id=${a.id})}" method="post">
                            <input type="hidden" name="observaciones" value="Rechazada por no cumplir requisitos">
                            <button class="btn btn-danger" type="submit">Rechazar</button>
                        </form>
                    </td>
                    <td th:unless="${a.estado.name() == 'PENDIENTE'}">—</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(adopciones)}">
            <h3>Aún no hay registros</h3>
            <p>Cuando existan solicitudes de adopción aparecerán aquí con estado y acciones.</p>
            <a class="btn btn-secondary" th:href="@{/admin(tab='adopciones')}">Ir al panel admin</a>
        </div>
    </div>
</section>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
