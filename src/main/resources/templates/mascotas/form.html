<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Formulario mascota')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<section class="section">
    <div class="container">
        <div class="panel" style="max-width:720px;margin:auto">
            <h1 class="section-title" th:text="${mascota.id == null} ? 'Nueva mascota' : 'Editar mascota'"></h1>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <form th:object="${mascota}"
                  th:action="${mascota.id == null} ? @{/mascotas/gestionar} : @{/mascotas/gestionar/{id}(id=${mascota.id})}"
                  method="post"
                  enctype="multipart/form-data">
                <label>Nombre</label>
                <input th:field="*{nombre}" required>
                <label>Especie</label>
                <select th:field="*{especieId}" required>
                    <option th:each="e : ${especies}" th:value="${e.id}" th:text="${e.nombre}"></option>
                </select>
                <label>Raza</label>
                <input th:field="*{raza}">
                <label>Edad</label>
                <input type="number" th:field="*{edad}" min="0">
                <label>Estado de salud</label>
                <input th:field="*{estadoSalud}">

                <div class="photo-upload">
                    <label for="fotoArchivo">Cargar foto desde tu computador</label>
                    <p class="hint">Usa JPG o PNG (máx. 5 MB). Evita HEIC de iPhone. Si también pegas una URL, el archivo tiene prioridad.</p>
                    <input id="fotoArchivo" class="file-input-visible" type="file" name="fotoArchivo"
                           accept="image/jpeg,image/png,image/webp,image/gif">
                    <small class="hint" id="fotoNombre">Ningún archivo seleccionado</small>

                    <label for="fotoUrl" style="margin-top:1rem;display:block">O URL de foto (opcional)</label>
                    <input id="fotoUrl" th:field="*{fotoUrl}" placeholder="https://...">
                    <small class="field-error" th:if="${#fields.hasErrors('fotoUrl')}" th:errors="*{fotoUrl}"></small>
                    <div class="photo-preview" th:if="${mascota.fotoUrl != null and !#strings.isEmpty(mascota.fotoUrl)}">
                        <img th:src="${mascota.fotoUrl}" alt="Vista previa" onerror="this.style.display='none'">
                    </div>
                </div>

                <label>Estado</label>
                <select th:field="*{estado}">
                    <option th:each="est : ${estados}" th:value="${est}" th:text="${est}"></option>
                </select>
                <label>Refugio</label>
                <select th:field="*{refugioId}" required>
                    <option th:each="r : ${refugios}" th:value="${r.id}" th:text="${r.nombre}"></option>
                </select>
                <label>Descripción</label>
                <textarea th:field="*{descripcion}" rows="4"></textarea>
                <div class="actions" style="margin-top:1rem">
                    <button class="btn btn-primary" type="submit">Guardar</button>
                    <a class="btn btn-secondary" th:href="@{/admin(tab='mascotas')}">Volver al panel</a>
                </div>
            </form>
            <form th:if="${mascota.id != null}"
                  th:action="@{/mascotas/gestionar/{id}/eliminar(id=${mascota.id})}"
                  method="post"
                  style="margin-top:1rem"
                  data-confirm="¿Segura de eliminar esta mascota? Se quitará del catálogo y no se puede deshacer."
                  data-confirm-title="Eliminar mascota"
                  data-confirm-ok="Sí, eliminar">
                <input type="hidden" name="volver" value="admin">
                <button class="btn btn-danger" type="submit">Eliminar mascota</button>
            </form>
        </div>
    </div>
</section>
<script>
  document.getElementById('fotoArchivo')?.addEventListener('change', (e) => {
    const file = e.target.files?.[0];
    const label = document.getElementById('fotoNombre');
    if (label) label.textContent = file ? file.name : 'Ningún archivo seleccionado';
  });
</script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
