<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="site-header">
    <div class="container nav">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark" aria-hidden="true"></span>
            Huellas de Amor
        </a>
        <div class="nav-links">
            <a th:href="@{/}">Inicio</a>
            <a th:href="@{/mascotas/catalogo}">Mascotas</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Admin</a>
            <a sec:authorize="hasAnyRole('VOLUNTARIO','ADMIN')" th:href="@{/voluntario}">Voluntario</a>
            <a sec:authorize="hasAnyRole('ADOPTANTE','ADMIN')" th:href="@{/adoptante}">Adoptante</a>
            <a sec:authorize="hasAnyRole('VOLUNTARIO','ADMIN')" th:href="@{/refugios}">Refugios</a>
            <a sec:authorize="hasAnyRole('VOLUNTARIO','ADMIN')" th:href="@{/adopciones/gestionar}">Adopciones</a>
            <a sec:authorize="isAnonymous()" th:href="@{/registro}">Registrarse</a>
            <a sec:authorize="isAnonymous()" class="btn btn-primary" th:href="@{/login}">Iniciar sesión</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" style="display:inline">
                <span sec:authentication="name"></span>
                <button class="btn btn-secondary" type="submit">Salir</button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>
