<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Panel admin')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<section class="section">
    <div class="container">
        <h1 class="section-title">Panel administrador</h1>
        <p class="section-lead">Vista general del sistema de adopción Huellas de Amor.</p>
        <div class="stats stagger">
            <div class="stat"><strong th:text="${totalMascotas}">0</strong><span>Mascotas totales</span></div>
            <div class="stat"><strong th:text="${disponibles}">0</strong><span>Disponibles</span></div>
            <div class="stat"><strong th:text="${#lists.size(solicitudes)}">0</strong><span>Solicitudes</span></div>
        </div>
        <div class="split">
            <div class="panel">
                <h2>Disponibles por especie</h2>
                <ul>
                    <li th:each="row : ${porEspecie}" th:text="${row[0]} + ': ' + ${row[1]}"></li>
                </ul>
                <h2>Disponibles por refugio</h2>
                <ul>
                    <li th:each="row : ${porRefugio}" th:text="${row[0]} + ': ' + ${row[1]}"></li>
                </ul>
            </div>
            <div class="panel">
                <h2>Accesos rápidos</h2>
                <div class="actions">
                    <a class="btn btn-primary" th:href="@{/mascotas/gestionar}">CRUD mascotas</a>
                    <a class="btn btn-secondary" th:href="@{/refugios}">CRUD refugios</a>
                    <a class="btn btn-secondary" th:href="@{/adopciones/gestionar}">Adopciones</a>
                    <a class="btn btn-secondary" th:href="@{/seguimientos}">Seguimientos</a>
                </div>
            </div>
        </div>
    </div>
</section>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
