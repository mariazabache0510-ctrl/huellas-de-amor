<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registro')}"></head>
<body class="auth-body">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="auth-stage">
    <div class="auth-orb auth-orb-a"></div>
    <div class="auth-orb auth-orb-b"></div>
    <div class="auth-grid auth-grid-register">
        <aside class="auth-showcase reveal">
            <p class="eyebrow">Únete a la comunidad</p>
            <h1>Crea tu perfil de adoptante</h1>
            <p>Cuéntanos un poco sobre ti para acompañarte en un proceso de adopción responsable.</p>
        </aside>

        <div class="auth-card auth-card-wide reveal">
            <div class="auth-card-glow"></div>
            <h2>Registro</h2>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <form class="auth-form register-grid" th:action="@{/registro}" th:object="${registro}" method="post">
                <div class="float-field">
                    <input id="nombre" th:field="*{nombre}" required placeholder=" ">
                    <label for="nombre">Nombre completo</label>
                </div>
                <div class="float-field">
                    <input id="username" th:field="*{username}" required placeholder=" ">
                    <label for="username">Usuario</label>
                </div>
                <div class="float-field">
                    <input id="correo" type="email" th:field="*{correo}" required placeholder=" ">
                    <label for="correo">Correo</label>
                </div>
                <div class="float-field">
                    <input id="password" type="password" th:field="*{password}" required placeholder=" ">
                    <label for="password">Contraseña</label>
                </div>
                <div class="float-field">
                    <input id="telefono" th:field="*{telefono}" placeholder=" ">
                    <label for="telefono">Teléfono</label>
                </div>
                <div class="float-field">
                    <input id="direccion" th:field="*{direccion}" placeholder=" ">
                    <label for="direccion">Dirección</label>
                </div>
                <div class="float-field full">
                    <textarea id="motivacion" th:field="*{motivacion}" rows="3" placeholder=" "></textarea>
                    <label for="motivacion">Motivación</label>
                </div>
                <div class="float-field">
                    <input id="vivienda" th:field="*{vivienda}" placeholder=" ">
                    <label for="vivienda">Tipo de vivienda</label>
                </div>
                <label class="check-line">
                    <input type="checkbox" th:field="*{tieneExperiencia}">
                    <span>Tengo experiencia con mascotas</span>
                </label>
                <button class="btn btn-primary btn-block btn-pulse full" type="submit">Crear cuenta</button>
            </form>
            <a class="auth-link" th:href="@{/login}">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
    </div>
</section>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
