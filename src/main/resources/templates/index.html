<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inicio')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<section class="hero">
    <div class="hero-media"></div>
    <div class="hero-overlay"></div>
    <div class="container hero-content">
        <h1 class="hero-brand">Huellas de Amor</h1>
        <p class="hero-copy">Centralizamos adopciones responsables en Villavicencio: mascotas, refugios, solicitudes y seguimiento postadopción en un solo lugar.</p>
        <div class="cta-row">
            <a class="btn btn-amber" th:href="@{/mascotas/catalogo}">Ver mascotas disponibles</a>
            <a class="btn btn-secondary" th:href="@{/registro}">Quiero adoptar</a>
        </div>
    </div>
</section>

<section class="section">
    <div class="container">
        <h2 class="section-title">Compañeros esperando hogar</h2>
        <p class="section-lead" th:text="'Hay ' + ${totalDisponibles} + ' mascotas disponibles ahora mismo. Explora, conoce su historia y da el primer paso.'"></p>
        <div class="grid-cards stagger">
            <article class="card" th:each="m : ${mascotasDestacadas}">
                <div class="card-media">
                    <img th:src="${m.fotoUrl}" th:alt="${m.nombre}">
                </div>
                <div class="card-body">
                    <span class="badge" th:text="${m.especieNombre}">Perro</span>
                    <h3 th:text="${m.nombre}">Max</h3>
                    <p class="meta" th:text="${m.raza} + ' · ' + ${m.refugioNombre}"></p>
                    <a class="btn btn-primary" th:href="@{/mascotas/detalle/{id}(id=${m.id})}">Conocer</a>
                </div>
            </article>
        </div>
    </div>
</section>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
