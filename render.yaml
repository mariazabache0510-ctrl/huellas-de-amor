services:
  - type: web
    name: huellas-de-amor
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      # Pega aquí la URL de Neon o de tu Postgres free existente en Render.
      # Formato: postgres://user:password@host/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0
