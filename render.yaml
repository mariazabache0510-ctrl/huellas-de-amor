services:
  - type: web
    name: huellas-de-amor
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: huellas-de-amor-db
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0

databases:
  - name: huellas-de-amor-db
    plan: free
    databaseName: huellas_de_amor
    user: huellas
